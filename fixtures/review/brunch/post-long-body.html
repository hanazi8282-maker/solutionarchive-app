할 수 있나요? 최고의 작품을 뽑는 브런치 공모전의 취지에 따라, 작가당 하나의 브런치북 (1인 1작품) 으로만 응모할 수 있습니다. 작가님의 소중한 브런치북 중에서도 가장 공들인 작품으로 제14회 브런치 공모전에 응모해 주세요. 단, 여러 편의 브런치북으로 내용을 이어 연재·완결했다면, 함께 심사받을 브런치북을 선택할 수 있습니다. 내용의 연결성 및 기획의도가 심사에 반영되오니 신중하게 선택해 주세요. 4) 하나의 브런치북을 종합 부문과 소설 부문 동시에 응모할 수 있나요? 작가당 하나의 브런치북으로만 응모할 수 있습니다. 또한 동일한 브런치북으로 두 부문에 중복 응모할 수 없습니다. 소설 작품이라면 [소설 부문]을 선택하여 응모해 주세요. 5) 브런치북을 만들었어요. 어떻게 응모하면 되나요? 제14회 브런치 공모전은 PC에서만 응모할 수 있습니다. PC에서 ' 브런치 공모전 화면 ' 또는 ' 내 브런치 (프로필) '에서 \u003e '응모하기' 버튼을 누르고 \u003e ' 응모 양식 화면 '에서 작품 정보를 입력 후 응모하시면 됩니다. 정상적으로 응모 완료된 경우, 응모 양식 화면 및 응모한 브런치북 PC 화면 상단에 '응모 완료'가 표시됩니다. 10월 18일(일) 23시 59분 59초(한국시간)까지 응모를 완료하셔야 하며, 마감 시각 이후에는 응모가 불가능합니다. 브런치 공모전 화면에서 응모하기 내 브런치(프로필)에서 응모하기 응모 양식 화면 바로가기 6) 10~30편의 글로 브런치북을 만들 수 있는데, 전체 분량이 30편 이상인 경우는 어떻게 하나요? 전체 분량이 글 30편 이상이라면, 여러 개의 브런치북으로 나누어 연재 또는 완 결해 주세요. 여러 편의 브런치북으로 내용을 이어 연재·완결했다면, 함께 심사받을 브런치북을 선택하여 응모할 수 있습니다. 내용의 연결성 및 기획의도가 심사에 반영되오니 신중하게 선택해 주세요. 7) 응모 기간 동안 연재를 완결해야 하나요? 소설 작품의 전체 분량을 브런치에 공개해야 하나요? 브런치북에 10편 이상의 글을 발행했다면 연재 중인 미완결 작품도 응모할 수 있습니다. 단, 소설 부문의 경우 기승전결의 전개를 심사에 중요하게 반영하므로, 브런치북에 완결까지의 내용을 발행하지 않았더라도 응모할 때는 결말을 포함한 전체 줄거리(시놉시스)를 입력하셔야 합니다. 또한 소설의 예상 완결 분량 대비 브런치북 응모작의 연재 분량을 함께 제출해 주세요. (예시 : 전체 분량의 80% 연재 완료) [이용 안내] 완결 브런치북 만들기 방법 [이용 안내] 연재 브런치북 만들기 방법 8) 시 작품 도 응모할 수 있나요? 어떤 부문으로 응모하면 될까요? 시 작품은 '에세이·시 부문'으로 응모해 주세요. 9) 과거에 브런치북 출판 프로젝트에 응모한 적 있습니다. 응모했던 작품으로 다시 응모할 수 있나요? 가능합니다. 단, '브런치북 출판 프로젝트' 등 브런치 공모전에서 수상한 브런치북 및 이미 책으로 출간된 브런치북은 응모 불가능하며, 응모하더라도 수상작에서 제외됩니다. 10) 이전 회차 브런치북 출판 프로젝트 대상 수상 작가입니다. 새로운 작품으로 응모해도 되나요? 브런치북 출판 프로젝트 대상 수상 이력이 있는 작가는 응모 불가하며, 응모해도 중복 수상이 불가합니다. 대상이 아닌 특별상, 금상, 은상 등의 수상 이력이 있는 작가, '브런치북 전자책 출판 프로젝트', '브런치북 오디오북 출판 프로젝트', 또는 '브런치북 AI 클래스 프로젝트' 수상 작가는 응모할 수 있습니다. 단, 과거 수상작으로 재응모는 불가능하며, 새로운 내용의 브런치북으로 응모할 수 있습니다. 11) 브런치 가 아닌 다른 곳에 게재한 글이나 다른 공모전에 응모했던 작품도 응모 가능한가요? 본인의 독창적인 창작물을 브런치에 쓰고, 브런치북으로 만들면 응모할 수 있습니다. 다만, 수상작으로 선정된 작품은 3년간 다른 웹\/앱 서비스에 중복 게재할 수 없으므로 수상 발표일로부터 타 사이트에서 비공개 또는 삭제하여야 합니다. 수상 시 비공개 또는 삭제 가능한지 여부를 해당 웹\/앱 서비스에 사전 문의한 후에 응모하시길 권장합니다.
