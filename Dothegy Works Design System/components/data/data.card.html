<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--bg-app); }
  .panel { background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DataTable, StatusBadge, RoleBadge } = window.DothegyWorksDesignSystem_cddc62;
  const arrow = <span style={{color:"var(--text-faint)"}}>→</span>;
  function Demo() {
    return (
      <div className="panel">
        <DataTable
          columns={[
            { key: "name", header: "제품명" },
            { key: "qty", header: "현재고", align: "right", numeric: true, render:(v)=> v.toLocaleString() },
            { key: "status", header: "상태", render: (v) => <StatusBadge status={v} /> },
            { key: "role", header: "담당", render: (v) => <RoleBadge role={v} size="sm" /> },
            { key: "go", header: "", align: "right", width: 40, render: () => arrow },
          ]}
          data={[
            { name: "티그레 6구 세트", qty: 2721, status: "정상", role: "admin" },
            { name: "쿠키 8구 세트", qty: 340, status: "주의", role: "admin" },
            { name: "파운드케이크 플레인", qty: 58, status: "생산필요", role: "member" },
            { name: "티그레 12구 세트", qty: 1200, status: "완료", role: "super_admin" },
          ]}
          onRowClick={() => {}}
        />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
