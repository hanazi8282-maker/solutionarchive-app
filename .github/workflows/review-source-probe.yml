# 리뷰 수집 소스 접근성 실측 — 데이터센터 IP 에서 뭐가 실제로 되는지.
#
# 수집이 아니라 **판정**이다. 소스당 최소 요청만 보내고 본문을 저장하지 않는다.
# 이 판정이 나와야 수집 계층을 설계할지, 아니면 다른 방식(브라우저 확장 등)으로
# 갈지 정할 수 있다.
#
# ⛔ permissions 를 read 로 좁힌다. 남의 사이트를 때리는 잡에 쓰기 권한을 주면
#    안 된다.
#
# ⛔ 스케줄 트리거를 넣지 않는다. 이건 일회성 판정이고, 반복 실행은 상대
#    서버에 대한 부하이자 차단을 부르는 행동이다.

name: Review Source Probe

on:
  workflow_dispatch:
  push:
    branches: [feat/review-source-probe]

permissions:
  contents: read

concurrency:
  group: review-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe sources
        run: node scripts/review-source-probe.mjs
