# v71cu S8: 유튜브 발굴(검색어 → 댓글 30+ 영상 → v: 임시 타깃) 하루 1회. 검색 YT_SEARCH_DAILY(60)·그 밖 YT_UNITS_DAILY(2000) 단위, api_quota_log 기록. 할당량 초과 응답이면 그날 끝.
name: YouTube Discover
on:
  schedule:
    - cron: '15 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-discover
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - name: YouTube discovery
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_SEARCH_DAILY: ${{ vars.YT_SEARCH_DAILY }}
          YT_UNITS_DAILY: ${{ vars.YT_UNITS_DAILY }}
        run: node scripts/youtube-discover.mjs
