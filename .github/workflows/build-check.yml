name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # 로그인 보호 경로·서버 액션 가드. 크론 라우트가 로그인에 막히면 여기서 실패한다.
      - run: node scripts/auth-selftest.mjs
      # Threads 토큰 3상태·refresh-token 크론 응답(만료·임박을 200 으로 숨기지 않는다), 크론 감시 판정.
      - run: node scripts/threads-token-selftest.mjs
      - run: node scripts/cron-watchdog-selftest.mjs
      # 발행 매칭·미연결 분류. 후보 집합(초안 + 칼럼 연재 편)이 좁아지면 칼럼 발행본이
      # "파이프라인 외"로 조용히 내려간다 — 그 회귀를 여기서 막는다. 네트워크·DB 없음.
      - run: node scripts/threads-match-selftest.mjs
      # 칼럼 연재 편 → posts 스테이징 행 생성. 연결된 행을 덮어쓰지 않는지 포함.
      - run: node scripts/column-threads-stage.mjs --self-test
      # 추출 시작 게이트가 서버·화면 한 벌인지. 갈라지면 시작할 수 있는데 버튼이 없는 화면이 된다.
      - run: node scripts/analyze-extract-gate-selftest.mjs
      - run: node scripts/aspect-verdict-selftest.mjs
      # 지불의사(WTP) 답 검증기 = wtp_signals 의 CHECK. 갈라지면 사람이 답을 다 채우고
      # 버튼을 누른 뒤에야 23514 로 죽는다. 가격을 내는 코드가 아니다 — 재료만 담는다.
      - run: node scripts/wtp-selftest.mjs
      # PMF 진단 저장 행이 DB CHECK(not_run 이면 축 전부 NULL)와 어긋나지 않는지 + 원문에 없는
      # 인용을 저장하지 않는지. 깨지면 진단 기록이 통째로 사라지거나 지어낸 인용이 화면에 앉는다.
      - run: node scripts/pmf-run-selftest.mjs
      # 처방 대상 선별((I,S)만) · 3상태 · 문장 템플릿 · 저신뢰 전달.
      - run: node scripts/remedy-selftest.mjs
      # 요약 마크다운 — 화면 밖으로 나가는 유일한 산출물이라 "없음"과 "확인 불가"가 섞이면 안 된다.
      - run: node scripts/summary-selftest.mjs
      # 진단 입력(패싯) 어휘가 화면·API·DB CHECK 한 벌인지. 갈라지면 폼을 다 채운 뒤 23514 로 죽는다.
      - run: node scripts/analyze-projects-facets-selftest.mjs
      # 목록의 "오래 멈춤"·정체 한 줄. 상태별 기준 시각이 뭉쳐지면 멀쩡한 행이 정체로 찍힌다.
      - run: node scripts/analyze-list-signals-selftest.mjs
      # 추출 소요시간 실측(중앙값·p90). 표본 5건 미만이면 화면에 숫자를 내지 않는 규칙을 고정한다.
      - run: node scripts/analyze-extract-stats-selftest.mjs
      # 어드바이저 매칭 3상태·불용어 회귀·SP-024 저신뢰 판정. 픽스처만 쓴다(네트워크·DB 없음).
      - run: node scripts/advisor-selftest.mjs
      # HN 실패신호 탐지(다단어 구문만·중복 append 방지·스윕 질의 URL). 네트워크 없음.
      - run: node scripts/hn-failure-signal-selftest.mjs
      # 인사이트 루프의 DB 오류 가드. 한 줄만 되돌아가도 조회 실패가 "패턴 없음"으로 접힌다.
      - run: node scripts/insight-loop-db-guard-selftest.mjs
      # 앵글 생성 낙관적 락 — 풀리면 더블클릭 한 번에 LLM 배치가 두 벌 나간다.
      - run: node scripts/analyze-angle-lock-selftest.mjs
      # judge 프롬프트 순서 = 비용 구조. 되돌아가면 20KB 코퍼스가 앵글마다 정가로 재전송된다.
      - run: node scripts/analyze-judge-prompt-selftest.mjs
      # LLM 재시도 예산(함수 상한 300초 안) + 요청당·하루 비용 상한이 실제로 막는지.
      - run: node scripts/analyze-llm-budget-selftest.mjs
      # 리뷰 수집 소스 2종(round-5 채택분). 픽스처만 쓴다 — 네트워크·DB 없음.
      #   okky  : commentCount 는 대댓글 포함 총합이다. 재귀 평탄화가 풀리면
      #           대댓글이 전부 "못 읽은 것"으로 세어져 가짜 실패가 쌓인다.
      #           반대로 삭제된 댓글이 카운터에만 남는 경우는 실패가 아니다.
      #   velog : released_at 이 UTC 다. KST 변환이 빠지면 증분 종료가 하루 밀린다.
      #           그리고 블롭에 이전/다음 글이 같이 오므로 스코프 필터가 유일한
      #           중복 적재 방어선이다(SP-031 과 같은 형태).
      - run: node scripts/review-okky-selftest.mjs
      - run: node scripts/review-velog-selftest.mjs
      # 위 둘의 소스 키가 마이그레이션·ADAPTERS 맵·워크플로 선택지와 같은 집합인지.
      # 하나라도 빠지면 코드만 있고 수집은 0건인 상태가 로그도 없이 유지된다.
      #
      # 여기에 robots fail-closed 경로도 들어 있다(2026-09-18, SP-032):
      # 403/404/HTML 본문 · `*` 그룹 없음 · `*` 그룹 있고 규칙 0개 · robots 가
      # 다른 호스트로 리다이렉트 · 소스별 통과 표식 · Crawl-delay.
      - run: node scripts/review-runner-selftest.mjs
      # robots 순수 판정(3상태 · 와일드카드 · 끝앵커 · ReDoS 방어 · 실측 원문 12종).
      # ⚠️ 2026-09-18 까지 이 파일은 CI 에 배선돼 있지 않았다 — 리뷰 수집 트랙의
      #    안전장치인데 사람이 손으로 돌려야만 돌았다. 깨져도 초록불이었다.
      - run: node scripts/review-robots-selftest.mjs
      # ── 2026-09-19 배선 (코드 감사 2-1) ─────────────────────────────────
      # 아래 31개는 리포에 있었지만 어떤 워크플로도 돌리지 않아 깨져도 초록불이었다.
      # 전부 픽스처만 쓰고(네트워크·DB·env 없음) 각 1초 안에 끝난다 — 09-19 에 env 없이 실측.
      # 빠진 2개(failed-angles-sync · strategy-principles-sync)는 docs/ 표 행수 단정이 현재
      # 원장과 어긋나 실패한다 — 테스트 기대값을 고칠지 원장을 되돌릴지는 사람 판단(감사 보고서).
      # 발행 게이트 CG-1/CG-2 의 유일한 테스트(case-pipeline)가 여기 처음 들어간다.
      # 발굴 게이트(감사 2-2) — 전에는 nightly-discovery 에서만 돌아 회귀가 머지 뒤 첫 밤에야 드러났다.
      - run: node scripts/discovery-selftest.mjs
      - run: node scripts/case-pipeline-selftest.mjs
      - run: node scripts/case-match-selftest.mjs
      - run: node scripts/case-review-rules-selftest.mjs
      - run: node scripts/score-predictions-selftest.mjs
      - run: node scripts/agents-status-selftest.mjs
      - run: node scripts/analyze-angle-adaptation-selftest.mjs
      - run: node scripts/analyze-angle-validate-selftest.mjs
      - run: node scripts/analyze-danawa-url-selftest.mjs
      - run: node scripts/onboarding-quiz-selftest.mjs
      - run: node scripts/voice-check-selftest.mjs
      - run: node scripts/insight-cli-selftest.mjs
      - run: node scripts/insight-kakao-selftest.mjs
      - run: node scripts/insight-patterns-selftest.mjs
      - run: node scripts/kakao-proxy-selftest.mjs
      - run: node scripts/threads-collect-selftest.mjs
      - run: node scripts/threads-replies-selftest.mjs
      - run: node scripts/threads-cron-status-selftest.mjs
      - run: node scripts/review-health-selftest.mjs
      - run: node scripts/review-purge-selftest.mjs
      # 리뷰 소스 파서 13종 — 구조 소실을 0건과 가르는 검사(§7.1)가 각 파일에 있다.
      - run: node scripts/review-82cook-selftest.mjs
      - run: node scripts/review-appstore-selftest.mjs
      - run: node scripts/review-bobaedream-selftest.mjs
      - run: node scripts/review-brunch-selftest.mjs
      - run: node scripts/review-clien-selftest.mjs
      - run: node scripts/review-damoang-selftest.mjs
      - run: node scripts/review-danawa-selftest.mjs
      - run: node scripts/review-fmkorea-selftest.mjs
      - run: node scripts/review-hackernews-selftest.mjs
      - run: node scripts/review-naver-blog-selftest.mjs
      - run: node scripts/review-theqoo-selftest.mjs
      - run: node scripts/review-todayhumor-selftest.mjs
      - run: node scripts/review-tumblbug-selftest.mjs
      # 빌드가 **실제로 읽는** 값만 준다. 나머지는 요청 시점(Vercel env)에서
      # 읽히지 서버 빌드에서 읽히지 않는다. 안 쓰는 이름을 여기 적어 두면
      # "CI 에 배선돼 있으니 등록돼 있겠지"로 읽혀 진단을 헛돌게 만든다.
      #
      # 뺀 것과 이유(진단 5-3 후속, 전부 빌드 시점 리더 0건):
      #   ANTHROPIC_API_KEY    — lib/analysis/llm.ts 는 호출 시점에 SDK 를 만들고
      #                          lib/insight/llm.ts 는 Actions 런타임에서만 읽는다
      #   CRON_SECRET          — lib/cron-auth.ts, 요청 시점. Vercel env 가 정본이다
      #   THREADS_USER_ID      — 리포 전체에 읽는 코드가 0건이다
      #   THREADS_ACCESS_TOKEN — 런타임 토큰은 api_tokens 행에서 온다(lib/threads/token.ts).
      #                          ⛔ 발행 자격증명을 CI env 에 두지 않는다 — CLAUDE.md §10.1
      #                          의 "정책이 아니라 구조" 를 지탱하는 자리다
      #   GITHUB_TOKEN(GH_PAT) — deploy-status 는 force-dynamic, 커밋은 Actions 기본 토큰
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
