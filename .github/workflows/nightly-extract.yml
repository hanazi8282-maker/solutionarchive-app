# 야간 자동 extract — 신규 리뷰가 쌓인 프로젝트의 속성(Stage1+Stage2)을 추출한다.
#
# 남헌 2026-09-23 확정: "extract 야간 자동 실행 허용 — 신규 리뷰 100건 이상 프로젝트만,
# 일 $5 상한 안에서, Gemini 429 면 다음 날로" (reports/2026-09-23/data-velocity-plan.md §1 Q1).
#
# ⚠️ `nightly-review-collect.yml` 헤더의 "extract 는 절대 자동으로 안 부른다"는 이 결정으로
#    해제됐다. 단 걱정의 실체(사람이 검수한 교정값이 매일 밤 날아간다)는 그대로 막힌다:
#    이 배치는 `status='collecting'` 인 프로젝트만 돌고 `force` 를 쓰지 않는다.
#    검수 이후 상태(reviewed/angled/done)는 `lib/analysis/extract-gate.ts` 가 거부한다.
#
# 엔진: 2026-09-28 부터 Gemini → Claude Sonnet(claude-cli, 구독 OAuth = Agent SDK 크레딧 경로).
#    GEMINI_API_KEY 는 더 이상 필요 없다. column-review.yml 과 같은 CLI 설치·시크릿을 쓴다.
#    구독 사용량 한도에 걸리면 lib/analysis/llm.ts ClaudeCliError → isQuotaFailure=true 로 배치를 멈춘다
#    (남은 프로젝트마다 extract_attempts 를 태우지 않는다). timeout 은 그 프로젝트만 실패.
#
# ⚠️ CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없으면 아무것도 하지 않고 종료코드 2 로 멈춘다
#    (scripts/extract-auto.mjs requiredKeyFor). 조용히 도는 것보다 시끄럽게 닫히는 편이 낫다.

name: Nightly Extract

on:
  schedule:
    # 18:33 UTC = KST 03:33. 리뷰 수집(KST 02:37)이 끝난 뒤다.
    # 정각·30분을 쓰지 않는 이유는 nightly-review-collect.yml 주석에 있다(전 세계 크론이 몰려 건너뛴다).
    - cron: '33 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '대상 선정만 하고 LLM 을 부르지 않는다'
        type: boolean
        default: true
      min_new:
        description: '마지막 추출 이후 신규 입력이 이만큼 이상인 프로젝트만'
        type: string
        default: '100'
      max_projects:
        description: '이번 실행에서 돌릴 최대 프로젝트 수'
        type: string
        default: '3'

# 두 실행이 겹치면 같은 프로젝트의 aspects 를 서로 delete→insert 한다.
concurrency:
  group: extract-auto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    # extract 1건 Gemini 실측 40~110초(2026-09-27). Sonnet(claude-cli)은 입력 ~12만 자에 최대 ~5분으로 잡는다 —
    # vars.EXTRACT_AUTO_MAX_PROJECTS=10 × 5분 + 설치 여유.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.251
          echo "CLAUDE_CLI_PATH=$(which claude)" >> "$GITHUB_ENV"
          claude --version

      - name: Extract aspects for projects with new reviews
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 기존 시크릿 재사용(column-review.yml). 없으면 스크립트가 시작하지 않는다. ANTHROPIC_API_KEY 는 넣지 않는다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_PROVIDER: claude-cli
          CLAUDE_CLI_MODEL: sonnet
          # 예산 추정기(budget.ts) 단가 = Sonnet. 실측 비용은 로그의 "claude-cli 실측 total_cost_usd" 줄을 본다.
          LLM_USD_PER_MTOK_IN: '3'
          LLM_USD_PER_MTOK_OUT: '15'
          # extract 입력은 최대 ~12만 자다. 기본 180초로는 모자란다.
          LLM_CLAUDE_CLI_TIMEOUT_MS: '600000'
          # 비용 상한은 lib/analysis/budget.ts 가 강제한다(프로세스 단위 = 이 실행 1회분).
          LLM_DAILY_BUDGET_USD: ${{ vars.LLM_DAILY_BUDGET_USD || '5' }}
          EXTRACT_AUTO_MIN_NEW: ${{ inputs.min_new || vars.EXTRACT_AUTO_MIN_NEW || '100' }}
          EXTRACT_AUTO_MAX_PROJECTS: ${{ inputs.max_projects || vars.EXTRACT_AUTO_MAX_PROJECTS || '3' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/extract-auto.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}
