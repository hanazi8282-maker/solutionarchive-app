# rr-v2 자동 승인만 수동으로 돌린다(v71dl, 2026-11-23) — 판정(1·2차 LLM)은 건너뛴다.
#
# 왜 있나: nightly-relevance 는 승인 앞에 판정이 붙어 한 번에 1~2시간 걸리고 구독 한도를 쓴다.
# 점진 해제 단계(500 → 2,000 → 4,500)를 하루에 올리려면 승인만 따로 돌릴 수 있어야 한다.
# 하는 일은 nightly-relevance 의 "Auto-approve" 스텝과 같다 — 같은 스크립트·같은 변수·같은 시크릿(새 시크릿·권한 확대 없음).
# 게이트(AUTO_APPROVAL_ENABLED·킬스위치)와 단계 상한(GRADUAL_RELEASE_*)은 스크립트가 그대로 지킨다.
#
# 되돌리기: 이 파일 삭제. 실행 중단은 리포 변수 GRADUAL_RELEASE_ENABLED=false.

name: Relevance Approve Only

on:
  workflow_dispatch:

# nightly-relevance 와 같은 그룹 — 두 실행이 겹쳐 같은 날 상한을 동시에 읽는 일을 막는다.
concurrency:
  group: relevance-judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Auto-approve full-agreement verdicts (flag-gated)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          GRADUAL_RELEASE_ENABLED: ${{ vars.GRADUAL_RELEASE_ENABLED || '' }}
          GRADUAL_RELEASE_STAGE: ${{ vars.GRADUAL_RELEASE_STAGE || '' }}
          GRADUAL_RELEASE_STAGE_SINCE: ${{ vars.GRADUAL_RELEASE_STAGE_SINCE || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/relevance-auto-approve.mjs
