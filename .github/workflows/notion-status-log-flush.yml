# 밀린 일일 상태 로그 올리기 — ops/state/status-log-pending/*.md 가 main 에 들어오면 Notion 에 쓰고 파일을 지운다.
#
# 왜: Claude Code CLI 세션은 Notion MCP 도 NOTION_API_TOKEN 도 없어 CLAUDE.md §11 행을 직접 못 쓴다(2026-09-27 실측).
#     폴백 파일을 PR 로 올리면 이 워크플로가 Actions 시크릿으로 대신 기록한다. 브리핑·즉시알림이 이 DB 에 의존한다.
#
# 트리거: main push 중 그 폴더가 바뀐 것 + 수동. 스케줄은 두지 않는다(크론 감시 대상만 늘어난다).
# 파일 삭제 커밋은 [skip ci] — 그 push 가 이 워크플로를 다시 깨우지 않게.
#
# ⛔ NOTION_API_TOKEN 외 시크릿 없음. DB 쓰기 없음. LLM 0.
name: Notion Status Log Flush

on:
  push:
    branches: [main]
    paths:
      - 'ops/state/status-log-pending/**'
  workflow_dispatch:

concurrency:
  group: notion-status-log-flush
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 무인 push 용 전용 GitHub App 설치 토큰(남헌 2026-09-25 B안). 기본 GITHUB_TOKEN 은 main 룰셋 bypass 주체가 될 수 없다(GH013).
      - name: Mint bot token
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Selftest (network-free)
        run: node scripts/notion-status-log-selftest.mjs

      - name: Flush pending status logs
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: node scripts/notion-status-log-flush.mjs

      - name: Commit removed files
        if: always()
        run: |
          if [ ! -d ops/state/status-log-pending ]; then echo "폴더 없음 — 커밋 생략"; exit 0; fi
          git add -A -- ops/state/status-log-pending
          if git diff --cached --quiet; then
            echo "지울 파일 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "notion-status-log-flush-bot"
          git config user.email "noreply@anthropic.com"
          git commit -m "chore(notion): 밀린 상태 로그 올림 — $(date -u +%F) [skip ci]"
          git push
