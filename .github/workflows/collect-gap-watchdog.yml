# 공백 감시자(남헌 v71k 3-3) — 정기 수집(Nightly Review Collect)·판정 체인(Nightly Relevance Judge)이 오래 비면 1회 깨운다.
#
# 왜: GitHub 예약 실행은 정시 근처 슬롯을 늦추거나 건너뛴다. 정기 수집 공백이 10-12 8시간 · 10-13 6시간 13분 · 10-14 6시간 46분 있었다
#   (gh run list 이력, reports/2026-10-14/audit-grading-and-shadow-rejudge-v71.md 부록 E-5).
# 동작: 30분 간격(11·41분 — 정각·30분은 전 세계 크론이 몰려 더 밀린다)으로 각 워크플로의 마지막 실행 시작 시각을 본다.
#   · 마지막 시작이 N분보다 오래됐고 · 진행/대기 중인 실행이 없고 · 4시간 안에 만든 수동(dispatch) 실행이 없으면 → workflow_dispatch 1회.
#   · 수집: 입력 dry_run=false · source=all 을 **명시**한다. "기본 입력 그대로"는 dry_run=true 라 아무것도 적재하지 않는다(수동 실행 함정).
#   · 판정: dry_run=false 를 명시한다(같은 이유).
# N 의 근거(코드·최근 30건 실행 이력):
#   · 수집: 정기 cron 슬롯(UTC 17:37 · 01:43 · 05:37 · 09:29 · 13:19 · 20:47) 사이 최대 간격 = 20:47→01:43 의 4시간 56분. × 1.5 = 7시간 24분 → 기본 7시간이었으나, 최근 공백(6h13m·6h46m·8h)이 7시간 아래라 v71m 에서 5시간 30분(330분)으로 낮췄다.
#     (최근 이력의 공백 6h13m·6h46m·8h 를 모두 잡는다. 더 짧게 잡으면 Actions 의 평소 지연 1~3시간과 구분이 안 돼 중복 실행이 늘어난다.)
#   · 판정: 정기 cron(UTC 19:03 · 02:03 · 06:03) 사이 최대 간격 = 06:03→19:03 의 13시간(체인이 끝난 뒤 정상적으로 비는 시간). 그래서 수집과 **같은 N 이 아니라** 기본 14시간을 쓴다.
#   두 값은 리포 변수 GAP_WATCHDOG_COLLECT_MIN · GAP_WATCHDOG_JUDGE_MIN (분 단위) 로 조정한다.
# 켜기/끄기: 리포 변수 GAP_WATCHDOG_ENABLED=false 면 job 이 시작되지 않는다(즉시 끄기). GAP_WATCHDOG_DRY 가 'false' 가 아니면 **건다고 로그만** 남긴다(기본 — 첫 가동 확인용).
#   실제 가동은 GAP_WATCHDOG_DRY=false 를 한 번 설정해야 한다. 되돌리기 = 변수 삭제 또는 이 파일 삭제.
# 안전: 이 job 만 actions 쓰기 권한 · main 에서만 · 건 이유를 STEP_SUMMARY 에 한 줄. 차단·soft-skip·램프·도메인 상한·$ 캡은 수집·판정 워크플로가 그대로 적용한다(여기서 건드리지 않는다).
# ⚠️ 한계: 이 감시자도 GitHub 예약 실행이라 같은 지연·누락을 받을 수 있다. 외부 예약기(다른 서버의 cron 이 gh workflow run 호출)가 대안이다.
name: Collect Gap Watchdog

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-gap-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    if: github.ref == 'refs/heads/main' && vars.GAP_WATCHDOG_ENABLED != 'false'
    runs-on: ubuntu-latest
    # v71bb: 판정 정체 스텝(npm ci 포함)을 이 job 에 얹어 5 → 10. 쓰기 권한 job 은 하나뿐이라는 선(gap-watchdog-selftest)을 지키려고 별 job 을 만들지 않았다.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY: ${{ vars.GAP_WATCHDOG_DRY != 'false' }}
      COLLECT_MIN: ${{ vars.GAP_WATCHDOG_COLLECT_MIN || '330' }}
      JUDGE_MIN: ${{ vars.GAP_WATCHDOG_JUDGE_MIN || '840' }}
    steps:
      - name: Check gaps
        run: |
          set -euo pipefail
          case "$COLLECT_MIN$JUDGE_MIN" in *[!0-9]*|'') echo "::error::N 이 숫자가 아니다 — 아무것도 하지 않는다"; exit 1;; esac
          now=$(date -u +%s)
          check() {
            wf="$1"; limit_m="$2"; shift 2
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 30 --json createdAt,status,event)
            busy=$(echo "$runs" | jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested" or .status=="in_progress")] | length')
            last=$(echo "$runs" | jq -r 'map(.createdAt) | max // empty')
            recent_dispatch=$(echo "$runs" | jq --argjson now "$now" '[.[] | select(.event=="workflow_dispatch" and ($now - (.createdAt | fromdateiso8601)) < 14400)] | length')
            if [ -z "$last" ]; then echo "$wf: 실행 이력을 못 읽었다 — 확인 불가라 건드리지 않는다" | tee -a "$GITHUB_STEP_SUMMARY"; return 0; fi
            age_m=$(( (now - $(date -u -d "$last" +%s)) / 60 ))
            echo "$wf: 마지막 시작 $last (${age_m}분 전) · 진행/대기 ${busy}건 · 4시간 안 수동 실행 ${recent_dispatch}건 · 기준 ${limit_m}분" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$age_m" -lt "$limit_m" ]; then return 0; fi
            if [ "$busy" != "0" ]; then echo "  → 진행/대기 중이라 건너뜀" | tee -a "$GITHUB_STEP_SUMMARY"; return 0; fi
            if [ "$recent_dispatch" != "0" ]; then echo "  → 4시간 안에 만든 수동 실행이 있어 건너뜀" | tee -a "$GITHUB_STEP_SUMMARY"; return 0; fi
            if [ "$DRY" != "false" ]; then echo "  → [DRY] 공백 ${age_m}분 ≥ ${limit_m}분 — 건다면: gh workflow run $wf $*" | tee -a "$GITHUB_STEP_SUMMARY"; return 0; fi
            gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main "$@"
            echo "  → 공백 ${age_m}분 ≥ ${limit_m}분 — $wf 를 1회 걸었다($*)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          check nightly-review-collect.yml "$COLLECT_MIN" -f dry_run=false -f source=all
          check nightly-relevance.yml "$JUDGE_MIN" -f dry_run=false

      # 판정 정체 감시(v71bb ⑮) — 위 공백 감시는 "실행이 안 돈다"만 본다. 10-20 처럼 실행은 도는데 한도 정지로 처리 0 이 이어지면 못 잡았다
      #   (11:31Z 주간 한도 정지, 리셋 12:00Z, 다음 실행 22:07Z — 10시간 반 공백). 판정 = lib/analysis/session-guard.ts relevanceStallDecision.
      # 재실행 1회: 한도 정지 뒤 리셋 시각(또는 정지+4시간)이 지났는데 그 뒤 수동 실행이 없을 때 · 최근 끝난 실행 2건 연속 실패/취소일 때.
      #   3연속 실패·"미판정 ≥500 인데 6시간 처리 0" 은 경보(Notion CTO 행, 표식 [판정 정체])만 — 의도된 정지(hop 상한·안전선)를 기계가 되살리지 않는다.
      # 끄기: GAP_WATCHDOG_ENABLED=false(전부) · GAP_WATCHDOG_DRY≠false 면 건다고 로그만 · 판정 정체만 끄기 = 리포 변수 RELEVANCE_STALL_WATCH=off.
      # 시크릿은 기존 값을 같은 목적(판정 실행 이력 읽기·Notion 일일 상태 로그)으로 쓴다 — 새 시크릿 없음. 권한은 이 job 그대로(넓히지 않음).
      # 되돌리기 = 아래 네 스텝 삭제(+ timeout 5).
      - uses: actions/checkout@v4
        if: vars.RELEVANCE_STALL_WATCH != 'off'
      - uses: actions/setup-node@v4
        if: vars.RELEVANCE_STALL_WATCH != 'off'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: vars.RELEVANCE_STALL_WATCH != 'off'
      - name: Judge stall check
        id: stall
        if: vars.RELEVANCE_STALL_WATCH != 'off'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -o pipefail
          gh run list -R "$GITHUB_REPOSITORY" --workflow nightly-relevance.yml --limit 20 --json createdAt,updatedAt,status,conclusion,event > "$RUNNER_TEMP/gh.json" || echo null > "$RUNNER_TEMP/gh.json"
          node scripts/relevance-stall-watch.mjs --act --gh-file="$RUNNER_TEMP/gh.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Judge stall rerun once
        if: steps.stall.outputs.rerun == 'true'
        env:
          REASON: ${{ steps.stall.outputs.reason }}
        run: |
          if [ "$DRY" != "false" ]; then echo "  → [DRY] 판정 정체 — 건다면: gh workflow run nightly-relevance.yml -f dry_run=false ($REASON)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh workflow run nightly-relevance.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          echo "  → 판정 정체 — nightly-relevance 를 1회 걸었다: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
