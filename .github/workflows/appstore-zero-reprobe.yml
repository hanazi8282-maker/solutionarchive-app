# 앱스토어 0건 타깃 러너 재프로브(남헌 v71al §2-1) — 판정용 일회성 실행. 수집이 아니다.
#
# 남헌 PC 에서는 애플 리뷰 RSS 가 인기 앱까지 entry 0건을 준다. 같은 목록을 Actions 러너 IP 에서 1페이지씩만 다시 물어
# "러너에서도 0건인가"를 가른다. 목록: reports/2026-10-17/appstore-zero-targets.txt(70개).
# 규칙: 요청 간격 3초 이상 · 총 80회 이하 · 4xx·429·캡차·비JSON 1건이면 즉시 중단(우회·재시도 없음) · DB 에 쓰지 않는다.
# 결과는 이 실행의 Summary 탭에 표 + 판정 한 줄로 남는다.
#
# ⛔ 스케줄 트리거를 넣지 않는다(반복 실행은 상대 서버 부하). permissions 는 read, 시크릿 없음.
# 되돌리기 = 이 파일과 scripts/appstore-zero-reprobe*.mjs 를 지우는 revert.

name: App Store Zero Reprobe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstore-zero-reprobe
  cancel-in-progress: false

jobs:
  reprobe:
    runs-on: ubuntu-latest
    # 70 요청 × 3초 ≈ 4분 + 응답 시간.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm ci 불필요 — 스크립트가 node 내장 fetch 와 리포 안 .ts 만 쓴다.
      - name: Reprobe zero-entry App Store targets (page 1 only)
        run: node scripts/appstore-zero-reprobe.mjs --targets=reports/2026-10-17/appstore-zero-targets.txt
