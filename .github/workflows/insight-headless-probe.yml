# 헤드리스 실행 판정 — `claude -p` 가 Actions 러너에서 실제 추론까지 하는지.
#
# 이 파이프라인의 유일한 미검증 전제를 잘라내기 위한 읽기 전용 프로브다.
# 판정이 끝나면(viable 이 나오면) 이 워크플로는 지워도 된다 — 결론만 남긴다.
#
# ⛔ permissions 를 read 로 좁힌다. 판정만 하는 잡에 쓰기 권한을 주면,
#    나중에 누가 여기에 한 줄 더하는 순간 main 에 쓸 수 있게 된다.

name: Insight Headless Probe

on:
  workflow_dispatch:
  push:
    # 이관 브랜치에서 러너 쪽 설치 경로를 실제로 재보기 위한 임시 트리거.
    # main 에 머지되면 이 항목은 지운다 — 남겨두면 무관한 푸시마다 돈다.
    branches: [feat/insight-loop-on-actions]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: |
          START=$(date +%s%3N)
          npm i -g @anthropic-ai/claude-code@2.1.251
          echo "설치 $(( $(date +%s%3N) - START ))ms"
          echo "CLAUDE_CLI_PATH=$(which claude)" >> "$GITHUB_ENV"

      # 3순위(리뷰 수집)에서 쓸 러너 출구 IP 를 미리 기록해둔다. 어느
      # 데이터센터에서 나가는지가 소스별 접근 가능/차단을 가른다.
      - name: Record runner egress
        continue-on-error: true
        run: |
          echo "egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/insight-headless-probe.mjs
