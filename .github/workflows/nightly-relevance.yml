# 야간 리뷰 관련성 판정(T2) — 수집한 원문 표본이 프로젝트 목적에 맞는지 채점한다.
#
# 남헌 2026-09-23 확정: "AI 관련성 판정은 Gemini, 야간 배치"
# (reports/2026-09-23/data-velocity-plan.md §1 Q5 · §2 T2).
#   ↳ 2026-09-25 결정 a 로 1차 판정은 claude-cli(구독 OAuth)로 바뀌었다(09-26 실제 전환). Gemini 는 2차 판정(독립성) 전용.
#     되돌리기 = 리포 변수 RELEVANCE_LLM_PROVIDER=gemini.
#
# ⚠️ 판정은 **플래그일 뿐**이다. 행을 지우지 않고 상태도 바꾸지 않는다. extract 입력 선별이
#    'irrelevant' 만 빼고 'unknown' 은 그대로 읽는다(CLAUDE.md §7.1 · §10.1).
#
# ⚠️ 프로바이더의 필수 키(claude-cli=CLAUDE_CODE_OAUTH_TOKEN · gemini=GEMINI_API_KEY)가 없으면 아무것도 하지 않고
#    종료코드 2 로 멈춘다. 조용히 도는 것보다 시끄럽게 닫히는 편이 낫다.

name: Nightly Relevance Judge

on:
  schedule:
    # 19:03 UTC = KST 04:03. extract s1(18:33Z)보다 30분 뒤. 원래 이유("같은 Gemini 무료 티어 RPM 을 나눠 쓴다")는
    # 둘 다 claude-cli 로 바뀌며 사라졌고, 실측으로는 Actions 지연(2~3시간) 탓에 둘이 겹쳐 돈다(09-27: extract 21:32~22:16Z,
    # relevance 21:50~22:33Z). 구독 한도는 5시간 창 사용량 기준이라 동시 실행 자체는 문제가 아니고, 야간 혼잡 구간 설계는
    # reports/2026-09-28/extract-adaptive-frequency-design.md §3.1 을 따른다. 시각은 그대로 둔다.
    # 정각·30분을 쓰지 않는 이유는 nightly-review-collect.yml 주석에 있다(전 세계 크론이 몰려 건너뛴다).
    - cron: '3 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '대상 선정만 하고 LLM 을 부르지 않는다'
        type: boolean
        default: true
      sample:
        description: '프로젝트당 판정할 표본 크기(T1 선별 통과분 상위)'
        type: string
        default: '200'
      max_projects:
        description: '이번 실행에서 돌릴 최대 프로젝트 수'
        type: string
        default: '5'

# 두 실행이 겹치면 같은 리뷰를 두 번 판정해 쿼터만 태운다.
concurrency:
  group: relevance-judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    # 프로젝트 5건 × 10회 호출 + 백오프. 상한에 걸리면 스크립트가 스스로 멈춘다.
    # 45분에 잘려 4번째 프로젝트가 9배치째에서 죽었고 agent_runs 가 running 으로 남았다
    # (2026-09-22 실측: 프로젝트당 약 11분). 남헌 2026-09-23 Q1(a) → 90분.
    # 스크립트 쪽 실행 시간 상한은 없다 — 멈추는 것은 예산(budget.ts)과 429 뿐이다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # claude -p 헤드리스용 CLI. 버전 고정 이유는 daily-cmo-loop.yml 과 같다.
      # 2026-09-25 남헌 결정 a: T2 판정을 claude-cli(구독 OAuth = Agent SDK 크레딧 경로)로 전환. 되돌리기 = 리포 변수 RELEVANCE_LLM_PROVIDER=gemini.
      - name: Install Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.251
          echo "CLAUDE_CLI_PATH=$(which claude)" >> "$GITHUB_ENV"
          claude --version

      - name: Judge review relevance for collecting projects
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ⛔ 사람이 등록해야 하는 시크릿(nightly-extract 와 같은 것). 없으면 시작하지 않는다.
          # 2026-09-26 실제 전환(09-25 PR #279 는 이 두 줄이 빠져 gemini 로 돌았다). 되돌리기 = 리포 변수 RELEVANCE_LLM_PROVIDER=gemini.
          LLM_PROVIDER: ${{ vars.RELEVANCE_LLM_PROVIDER || 'claude-cli' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 달러 예산은 **gemini 로 되돌렸을 때만** 적용된다 — claude-cli 는 budget.ts 를 타지 않는다(llm.ts UNMETERED, 2026-09-29).
          # 옛 "크레딧 기간 한시 상향 $15 까지 11/5"(BOOST/UNTIL)와 Opus 추정 단가는 뺐다: 전제였던 $250 크레딧이 이 경로와
          # 무관하다고 09-26 정정됐고, 추정 예산이 정상 실행을 끊은 사고(09-28, PR #329)의 뿌리가 그 추정 자체였다.
          LLM_DAILY_BUDGET_USD: ${{ vars.LLM_DAILY_BUDGET_USD || '5' }}
          # 요청당(=프로젝트 지갑) 상한(PR #329 값 유지). gemini 폴백에서 표본 200건=10호출이 기본 0.5 에 걸리지 않게.
          LLM_REQUEST_BUDGET_USD: '2'
          RELEVANCE_SAMPLE: ${{ inputs.sample || vars.RELEVANCE_SAMPLE || '200' }}
          RELEVANCE_MAX_PROJECTS: ${{ inputs.max_projects || vars.RELEVANCE_MAX_PROJECTS || '5' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/relevance-judge-auto.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}

      # T2 2차 판정 — 자동 승인(rr-v2)의 입력인 second_verdict 를 단다. 이 스텝 전까지는 세션이 손으로만 달아 자동 승인이 0건이었다.
      # 대상: 1차 판정 ∧ 2차·사람 없음 ∧ judged_at ≥ AUTO_APPROVAL_SINCE(없으면 오늘 KST) ∧ 1차가 Gemini 아님(독립성). 상한 RELEVANCE_SECOND_MAX.
      # provider 는 스크립트가 gemini 로 고정한다(1차 claude-cli 와 다른 계열). GEMINI_API_KEY 는 위 1차 스텝과 같은 기존 시크릿이다(새 시크릿 없음).
      # 실패해도 자동 승인·리포트를 막지 않는다(continue-on-error). 2차가 0건이면 자동 승인도 0건일 뿐이다.
      # 되돌리기 = 이 스텝 삭제(또는 리포 변수 RELEVANCE_SECOND_MAX 로 상한 조정).
      - name: Second-opinion judge (gemini, independent of first pass)
        if: success()
        continue-on-error: true
        # 스크립트가 20분(RELEVANCE_SECOND_DEADLINE_MIN)에 스스로 멈춘다. 이건 그게 고장 났을 때의 안전판.
        timeout-minutes: 30
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          RELEVANCE_SECOND_MAX: ${{ vars.RELEVANCE_SECOND_MAX || '200' }}
          LLM_DAILY_BUDGET_USD: ${{ vars.LLM_DAILY_BUDGET_USD || '5' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/relevance-second-judge-auto.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}

      # T2 완전 동의 자동 승인(CLAUDE.md §10.1 예외, reports/2026-09-28/approval-automation-design.md).
      # ⛔ 기본 꺼짐 — 리포 변수 AUTO_APPROVAL_ENABLED=true 와 AUTO_APPROVAL_SINCE=<YYYY-MM-DD> 가 없으면 DB 도 열지 않고 끝난다.
      # 킬스위치가 걸리면 승인 0건 + Notion 일일 상태 로그(사람판단필요). NOTION_API_TOKEN 은 다른 워크플로와 같은 목적의 기존 시크릿이다.
      - name: Auto-approve full-agreement verdicts (flag-gated, default off)
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/relevance-auto-approve.mjs

      # 케이스 무브 자동 승인 ca-v1(CLAUDE.md §10.1 예외 2, docs/case-approval-automation-roadmap.md).
      # ⛔ 기본 꺼짐 — 리포 변수 CASE_AUTO_APPROVAL_STAGE=candidate|approve 와 CASE_AUTO_APPROVAL_SINCE 가 없으면 DB 도 열지 않는다.
      # rr-v1 게이트에 종속이라 위 스텝과 같은 AUTO_APPROVAL_* 변수를 읽는다. 시크릿은 위 스텝과 같은 셋이다(새 시크릿 없음).
      - name: Case move auto-approval ca-v1 (stage-gated, default off)
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          CASE_AUTO_APPROVAL_STAGE: ${{ vars.CASE_AUTO_APPROVAL_STAGE || 'off' }}
          CASE_AUTO_APPROVAL_SINCE: ${{ vars.CASE_AUTO_APPROVAL_SINCE || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/case-auto-approve.mjs

      # 결정 b(증량 싱크 8번): 사람 채점(human_verdict) 대비 LLM 판정 일치율을 매일 요약에 남긴다. 읽기 전용.
      - name: Relevance eval report (human vs LLM)
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/relevance-eval-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"
