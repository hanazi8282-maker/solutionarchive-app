정합니다. 참여 방법 브런치 독서클럽 \u003e 라이브독서 \u003e 독서노트 쓰기 \u003e 이벤트 참여 동의 이벤트 참여하기를 활성화하고 독서노트를 발행하면, 자동으로 이벤트 참여 완료됩니다. 독서노트를 SNS 또는 카카오톡 등에 공유하면 경품 당첨 확률이 높아집니다. [이벤트 참여] 라이브독서로 독서노트 쓰기 \u003e ※ 이벤트 참여 전 아래 FAQ 및 유의사항을 꼭 확인해 주세요. ※ 이벤트는 브런치 안드로이드 앱 v6.4.9, IOS 앱 v6.4.16이상 최신 버전에서 참여하실 수 있습니다. ※ 이벤트가 시작되면 브런치 앱으로 안내를 받으실 수 있습니다. '이벤트 정보 수신 동의' 를 켜주시면 브런치팀이 알림을 보내드립니다. ※ 이벤트 정보 수신 동의는 [브런치 앱 \u003e 내 서랍 \u003e 설정 \u003e '이벤트 정보 수신 동의'에서 확인해 주세요. FAQ Q. '라이브독서'는 무엇인가요 A. '라이브독서'란 러닝 앱으로 달리기를 기록하듯 실시간으로 독서 시간과 분량을 기록하는 기능입니다. 라이브독서와 독서노트 기능에 대한 자세한 방법은 브런치팀 공지 브런치 독서클럽 오픈 및 라이브독서 이용 안내 를 참고해 주세요. Q. 독서노트에 이벤트 스탬프를 표시하고 싶어요. A. 이벤트 기간 동안 라이브독서하면 독서 인증샷을 남길 때 이벤트 참여 여부를 ON으로 설정하고 독서노트를 발행하는 경우 독서클럽 이벤트 스탬프를 표시해 드립니다. Q. 이벤트는 누가 참여할 수 있나요 A. 브런치 가입자라면 누구나 이벤트에 참여할 수 있습니다. 브런치 작가뿐만 아니라 독자(독서가)도 독서노트를 발행할 수 있고, 이벤트에 참여할 수 있습니다. Q. 어떤 책을 읽어야 하나요? A. 제한 없이 어떤 책을 읽더라도 이벤트에 참여할 수 있습니다. Q. 이벤트 당첨자는 어떻게 선정되나요? A. 이벤트 기간 동안 라이브독서하고 독서노트를 작성한 참여자 중 추첨을 통해 당첨자를 선정합니다. 독서노트를 SNS 또는 카카오톡 등에 공유하면 경품 당첨 확률이 더 높아집니다. 당첨자는 10월 7일(수) 한국문화예술위원회 브런치 를 통해 발표합니다. Q. 이벤트 참여를 취소할 수 있나요? A. 독서노트 발행 전 이벤트 참여 동의 여부를 직접 설정할 수 있습니다. 최초 이벤트 참여 동의 후 참여 취소가 불가능합니다. Q. 라이브독서 후 독서 인증샷 촬영 화면에 독서클럽 이벤트 스탬프가 보이지 않아요. A. 이벤트 스탬프는 해당 이벤트 기간 중 표시되며 브런치 안드로이드 앱 v6.4.9, IOS 앱 v6.4.16이상 최신 버전에서 참여하실 수 있습니다. 이벤트가 시작되면 최신 버전으로 앱을 업데이트하고, 이벤트에 참여해 보세요. 유의사항 브런치 앱에서 라이브독서로 책을 읽고, 독서노트 쓰기 화면에서 '이벤트 참여하기'에 동의 후 독서노트를 발행해야 이벤트에 정상 참여됩니다. 이벤트 기간 동안 독서노트를 발행한 참여자 중 추첨을 통해 당첨자를 선정합니다. 독서노트를 SNS 또는 카카오톡 등에 공유하면 경품 당첨 확률이 더 높아집니다. 브런치 운영정책이나 카카오 이용 약관에 부합하지 않는 독서노트는 당첨 대상에서 제외될 수 있습니다. 당첨자는 2026년 10월 7일(수) 한국문화예술위원회의 브런치 를 통해 발표합니다. 당첨자분들에게는 브런치 앱 알림을 통해 경품 배송 관련 내용을 안내해 드립니다. 당첨자에게는 브런치 앱 알림으로 개별 안내합니다. 알림 설정이 OFF인 경우 확인이 어려울 수 있으니 사전에 꼭 확인해 주시기 바랍니다. (*브런치 앱 \u003e [설정] \u003e [기타 알림 설정] \u003e [서비스 소식 알림 및 이벤트 정보 수신 동의] 여부 확인 필수) 경품 지급을 위해 필요한 개인정보 등의 요청에 대해 7일 이내 회신이 없거나 개인정보가 정확하지 않은 경우 수령의사가 없는 것으로 간주되어 당첨이 취소됩니다. 당첨 시 입력한 개인정보는 한국문화예술위원회에서 당첨자 선정 및 경품 지급을 위해서만 사용되며 경품 지급 후 폐기됩니다. 본 이벤트는 당사 사정에 따라 사전 고지 없이 변경되거나 종료될 수 있습니다.","
