# 자율 VOC 발굴 — 후보를 제안하고 **실측으로 검증한 것만** 적재한다.
#
# 설계: docs/discovery-design.md
# 채택 조건은 LLM 의 주장이 아니라 프로브가 센 hit 수다. 그게 이 루프에
# DB 쓰기 권한을 준 조건이다(CLAUDE.md §10.1).
#
# ⛔ permissions 를 read 로 좁힌다. 이 잡은 리포에 커밋하지 않는다.
#    DB 쓰기 범위도 §10.1 이 정한 세 테이블뿐이다 — `review_sources` 는 안 건드린다.
#
# ⛔ 이 워크플로는 수집(review-collect)을 부르지 않는다. 타깃만 만들고 멈춘다.
#    같은 밤 24분 뒤 Nightly Review Collect(17:37 UTC)가 그 타깃을 주워 간다.

name: Nightly Discovery

on:
  schedule:
    # 17:13 UTC = KST 02:13. 리뷰 수집(17:37 UTC)보다 24분 앞이다 —
    # 오늘 밤 만든 타깃이 오늘 밤 수집에 들어간다.
    #
    # ⚠️ 정각(`0 17`)을 쓰지 않는다. 정각·30분은 전 세계 크론이 몰려 Actions 가
    #    스케줄 실행을 미루거나 통째로 건너뛴다(2026-09-01 실측 — 첫 실행이
    #    1시간 넘게 발화하지 않았다). 설계서의 `0 17` 을 `13 17` 로 옮긴 이유다.
    - cron: '13 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '프로브까지만 하고 DB 에 쓰지 않는다'
        type: boolean
        default: true
      kind:
        description: '축 고정 (비우면 이력에서 고른다)'
        type: choice
        options:
          - ''
          - physical
          - saas
        default: ''
      target:
        description: '이번 실행에서 받을 후보 수'
        type: string
        default: '2'

# 두 실행이 겹치면 같은 후보를 두 번 적재하려다 UNIQUE 로 한쪽이 죽는다.
concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    # LLM 1회(최대 5분) + 후보당 프로브 1건 + 다나와 Crawl-delay 10초. 여유 포함.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 버전을 고정한다 — 'latest' 면 어느 날 밤 조용히 다른 바이너리를 집는다.
      - name: Install Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.251
          echo "CLAUDE_CLI_PATH=$(which claude)" >> "$GITHUB_ENV"
          claude --version

      # ⚠️ 검증부터 통과시킨다. 판정 로직이 깨진 채로 돌면 그날 밤 만들어진
      #    프로젝트를 아무도 믿을 수 없고, 되돌리려면 사람이 손으로 지워야 한다.
      - name: Selftest
        run: node scripts/discovery-selftest.mjs

      - name: Run discovery
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 후보 제안용. 자식 프로세스에는 이것만 넘어간다 — DB 자격증명은 안 넘어간다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCOVERY_TARGET: ${{ inputs.target || vars.DISCOVERY_TARGET || '2' }}
          DISCOVERY_MIN_VOC_HITS: ${{ vars.DISCOVERY_MIN_VOC_HITS || '30' }}
          # 상한. 하한만 있으면 초대형 브랜드가 전부 통과한다(2026-09-17 실측:
          # Notion 79,072 · Heroku 25,461 전부 accepted). 근거는 lib/discovery/candidate.ts
          # 의 MAX_VOC_HITS 주석. ⚠️ 이 값을 999 이상으로 올리면 다나와 캡(`999+`)이
          # 판정 불가가 되어 physical 후보가 모두 unverified 로 떨어진다.
          DISCOVERY_MAX_VOC_HITS: ${{ vars.DISCOVERY_MAX_VOC_HITS || '500' }}
          # 스케줄에는 inputs 가 없어 빈 문자열이 온다 — 그때 리포 변수로 축을 고정한다(둘 다 비면 미지정 = 이력 교대).
          DISCOVERY_KIND: ${{ inputs.kind || vars.DISCOVERY_KIND }}
        run: |
          node scripts/discovery-run.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}
