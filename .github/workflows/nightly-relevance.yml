# 야간 리뷰 관련성 판정(T2) — 수집한 원문 표본이 프로젝트 목적에 맞는지 채점한다.
#
# 남헌 2026-09-23 확정: "AI 관련성 판정은 Gemini, 야간 배치"
# (reports/2026-09-23/data-velocity-plan.md §1 Q5 · §2 T2).
#   ↳ 2026-09-25 결정 a 로 1차 판정은 claude-cli(구독 OAuth)로 바뀌었다(09-26 실제 전환). Gemini 는 2차 판정(독립성) 전용.
#     되돌리기 = 리포 변수 RELEVANCE_LLM_PROVIDER=gemini.
#
# ⚠️ 판정은 **플래그일 뿐**이다. 행을 지우지 않고 상태도 바꾸지 않는다. extract 입력 선별이
#    'irrelevant' 만 빼고 'unknown' 은 그대로 읽는다(CLAUDE.md §7.1 · §10.1).
#
# ⚠️ 프로바이더의 필수 키(claude-cli=CLAUDE_CODE_OAUTH_TOKEN · gemini=GEMINI_API_KEY)가 없으면 아무것도 하지 않고
#    종료코드 2 로 멈춘다. 조용히 도는 것보다 시끄럽게 닫히는 편이 낫다.

name: Nightly Relevance Judge

on:
  schedule:
    # 19:03 UTC = KST 04:03. extract s1(18:33Z)보다 30분 뒤. 원래 이유("같은 Gemini 무료 티어 RPM 을 나눠 쓴다")는
    # 둘 다 claude-cli 로 바뀌며 사라졌고, 실측으로는 Actions 지연(2~3시간) 탓에 둘이 겹쳐 돈다(09-27: extract 21:32~22:16Z,
    # relevance 21:50~22:33Z). 구독 한도는 5시간 창 사용량 기준이라 동시 실행 자체는 문제가 아니고, 야간 혼잡 구간 설계는
    # reports/2026-09-28/extract-adaptive-frequency-design.md §3.1 을 따른다. 시각은 그대로 둔다.
    # 정각·30분을 쓰지 않는 이유는 nightly-review-collect.yml 주석에 있다(전 세계 크론이 몰려 건너뛴다).
    - cron: '3 19 * * *'
    # 남헌 v30 §5(2026-10-07): 구독 한도 오류로 멈추면 4시간(또는 CLI 리셋 시각) 뒤 최대 2회 재시도.
    # 02:03Z(KST 11:03)(v71o 부터 재시도 전용은 이 한 줄 — 아래 06:03Z 는 정규 2회차). 오늘 정규 실행이 한도(quota)로 멈춘 게 아니거나 아직 이르면
    # 스크립트가 기록 없이 exit 0 + ran=false 로 끝나고 아래 스텝은 전부 건너뛴다(cron-watchdog 는 success 로 본다).
    # 크론 줄은 lib/analysis/session-guard.ts RELEVANCE_SLOTS 와 1:1 — 여기만 바꾸면 스크립트가 exit 2 로 멈춘다.
    - cron: '3 2 * * *'
    # 남헌 v71o 2(2026-10-14): 06:03Z(KST 15:03)를 재시도 전용(r2)에서 정규 2회차(s2)로 바꿨다 — 정규 19:03Z + 06:03Z 하루 2회(간격 11h·13h).
    # 정규 실행이 하루 1회라 적체 약 52,000건이 약 13일 걸렸다. 1회 상한(RELEVANCE_SECOND_MAX)·$ 캡은 그대로. 되돌리기 = RELEVANCE_SLOTS 의 s2 를 r2 로 되돌리는 한 줄(이 cron 줄은 그대로).
    - cron: '3 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '대상 선정만 하고 LLM 을 부르지 않는다'
        type: boolean
        default: true
      # 기본값을 비워 둔다 — 예전엔 입력 기본값('200'·'5')이 리포 변수보다 먼저 잡혀 수동 실행에서 변수가 무시됐다.
      sample:
        description: '프로젝트당 이번 실행 판정 상한(비우면 리포 변수 RELEVANCE_SAMPLE → 1000)'
        type: string
        default: ''
      max_projects:
        description: '이번 실행 최대 프로젝트 수(비우면 리포 변수 RELEVANCE_MAX_PROJECTS → 30)'
        type: string
        default: ''
      # 자기 호출 체인(전량 판정) — relaunch job 이 다음 실행을 부를 때 넘긴다. 사람이 수동으로 돌릴 땐 비워 둔다(= 0, 새 체인 시작).
      chain_hop:
        description: '체인 hop 번호(자동). 비우면 0'
        type: string
        default: ''
      chain_zero:
        description: '체인 연속 0건 수(자동). 비우면 0'
        type: string
        default: ''

# 두 실행이 겹치면 같은 리뷰를 두 번 판정해 쿼터만 태운다.
concurrency:
  group: relevance-judge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    # 프로젝트 5건 × 10회 호출 + 백오프. 상한에 걸리면 스크립트가 스스로 멈춘다.
    # 45분에 잘려 4번째 프로젝트가 9배치째에서 죽었고 agent_runs 가 running 으로 남았다
    # (2026-09-22 실측: 프로젝트당 약 11분). 남헌 2026-09-23 Q1(a) → 90분.
    # 전량 판정: 스크립트가 RELEVANCE_DEADLINE_MIN(기본 80분)에 새 묶음을 멈추고, 뒤 스텝(2차 20분 자체 마감 등)까지 이 안에 끝난다.
    # v71k: 2차 마감을 40분까지 올릴 수 있게 120→150(1차 80분 + 2차 40분 + 승인·리포트 여유 30분). 상한일 뿐 평소엔 일찍 끝난다.
    timeout-minutes: 150
    # relaunch job 이 읽는다(자기 호출 체인). 판정 스텝이 안 돌았거나 죽었으면 비어 있고 → 부르지 않는다.
    outputs:
      relaunch: ${{ steps.judge.outputs.relaunch }}
      wait_min: ${{ steps.judge.outputs.wait_min }}
      next_hop: ${{ steps.judge.outputs.next_hop }}
      next_zero: ${{ steps.judge.outputs.next_zero }}
    env:
      # 발화한 크론 → 슬롯(main·r1·r2). 판정 스텝의 재시도 판정과, 모든 스텝(판정·2차·자동 승인·ca-v1)의
      # run_key 접미사를 정한다(session-guard.ts relevanceRunSuffix) — 재시도·수동이 같은 날 정규 행을 덮지 않게.
      RELEVANCE_SLOT_CRON: ${{ github.event.schedule }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # claude -p 헤드리스용 CLI. 버전 고정 이유는 daily-cmo-loop.yml 과 같다.
      # 2026-09-25 남헌 결정 a: T2 판정을 claude-cli(구독 OAuth = Agent SDK 크레딧 경로)로 전환. 되돌리기 = 리포 변수 RELEVANCE_LLM_PROVIDER=gemini.
      - name: Install Claude Code CLI
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.251
          echo "CLAUDE_CLI_PATH=$(which claude)" >> "$GITHUB_ENV"
          claude --version

      - name: Judge review relevance for collecting projects
        id: judge
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ⛔ 사람이 등록해야 하는 시크릿(nightly-extract 와 같은 것). 없으면 시작하지 않는다.
          # 2026-09-26 실제 전환(09-25 PR #279 는 이 두 줄이 빠져 gemini 로 돌았다). 되돌리기 = 리포 변수 RELEVANCE_LLM_PROVIDER=gemini.
          LLM_PROVIDER: ${{ vars.RELEVANCE_LLM_PROVIDER || 'claude-cli' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 달러 예산은 **gemini 로 되돌렸을 때만** 적용된다 — claude-cli 는 budget.ts 를 타지 않는다(llm.ts UNMETERED, 2026-09-29).
          # 옛 "크레딧 기간 한시 상향 $15 까지 11/5"(BOOST/UNTIL)와 Opus 추정 단가는 뺐다: 전제였던 $250 크레딧이 이 경로와
          # 무관하다고 09-26 정정됐고, 추정 예산이 정상 실행을 끊은 사고(09-28, PR #329)의 뿌리가 그 추정 자체였다.
          LLM_DAILY_BUDGET_USD: ${{ vars.LLM_DAILY_BUDGET_USD || '5' }}
          # 요청당(=프로젝트 지갑) 상한(PR #329 값 유지). gemini 폴백에서 표본 200건=10호출이 기본 0.5 에 걸리지 않게.
          LLM_REQUEST_BUDGET_USD: '2'
          RELEVANCE_SAMPLE: ${{ inputs.sample || vars.RELEVANCE_SAMPLE || '1000' }}
          RELEVANCE_MAX_PROJECTS: ${{ inputs.max_projects || vars.RELEVANCE_MAX_PROJECTS || '30' }}
          RELEVANCE_DEADLINE_MIN: ${{ vars.RELEVANCE_DEADLINE_MIN || '80' }}
          # 소스 균등: 제외는 fail-closed(값은 기본 youtube 에 더해짐, 'none' 만 전부 허용) · 맨 뒤 기본 kakao_cafe,kakao_blog('none' = 없음). 유튜브 제목 매핑이 생기면 RELEVANCE_EXCLUDE_SOURCES=none.
          RELEVANCE_EXCLUDE_SOURCES: ${{ vars.RELEVANCE_EXCLUDE_SOURCES || '' }}
          RELEVANCE_LAST_SOURCES: ${{ vars.RELEVANCE_LAST_SOURCES || '' }}
          # 소비재 태그(남헌 v61, consumer_material_tags) 입력을 대기열에서 뺀다. 재개 = 리포 변수 RELEVANCE_SKIP_CONSUMER=off.
          RELEVANCE_SKIP_CONSUMER: ${{ vars.RELEVANCE_SKIP_CONSUMER || 'on' }}
          # 판정 기준(남헌 v66·v67): 기본 v2.2, 리포 변수 RELEVANCE_CRITERIA=v21|old 로 되돌린다.
          RELEVANCE_CRITERIA: ${{ vars.RELEVANCE_CRITERIA || 'v22' }}
          # 자기 호출 체인. 끄기 = 리포 변수 RELEVANCE_CHAIN=off(다음 hop 부터 안 부른다). 만료는 config relevance_cap_until.
          RELEVANCE_CHAIN: ${{ vars.RELEVANCE_CHAIN || 'on' }}
          RELEVANCE_CHAIN_MAX_HOPS: ${{ vars.RELEVANCE_CHAIN_MAX_HOPS || '24' }}
          RELEVANCE_CHAIN_HOP: ${{ inputs.chain_hop || '0' }}
          RELEVANCE_CHAIN_ZERO: ${{ inputs.chain_zero || '0' }}
          # 영역 최소 판정량(v37 U1). 비면 config/areas.json floor(제안 200). 되돌리기 = 리포 변수 삭제.
          RELEVANCE_AREA_FLOOR: ${{ vars.RELEVANCE_AREA_FLOOR || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/relevance-judge-auto.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}

      # T2 2차 판정 — 자동 승인(rr-v2)의 입력인 second_verdict 를 단다. 이 스텝 전까지는 세션이 손으로만 달아 자동 승인이 0건이었다.
      # 대상: 1차 판정 ∧ 2차·사람 없음 ∧ judged_at ≥ AUTO_APPROVAL_SINCE(없으면 오늘 KST) ∧ 1차가 Gemini 아님(독립성). 상한 RELEVANCE_SECOND_MAX.
      # provider 는 스크립트가 gemini 로 고정한다(1차 claude-cli 와 다른 계열). GEMINI_API_KEY 는 위 1차 스텝과 같은 기존 시크릿이다(새 시크릿 없음).
      # 실패해도 자동 승인·리포트를 막지 않는다(continue-on-error). 2차가 0건이면 자동 승인도 0건일 뿐이다.
      # 되돌리기 = 이 스텝 삭제(또는 리포 변수 RELEVANCE_SECOND_MAX 로 상한 조정).
      - name: Second-opinion judge (gemini, independent of first pass)
        if: success() && steps.judge.outputs.ran != 'false'
        continue-on-error: true
        # 스크립트가 RELEVANCE_SECOND_DEADLINE_MIN(기본 20분, 리포 변수로 40분까지)에 스스로 멈춘다. 이건 그게 고장 났을 때의 안전판.
        timeout-minutes: 55
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          RELEVANCE_SECOND_MAX: ${{ vars.RELEVANCE_SECOND_MAX || '200' }}
          # v71k: 마감(분)과 순서. 되돌리기 = 변수 삭제(20분) / RELEVANCE_SECOND_ORDER=legacy(v70 순서).
          RELEVANCE_SECOND_DEADLINE_MIN: ${{ vars.RELEVANCE_SECOND_DEADLINE_MIN || '20' }}
          RELEVANCE_SECOND_ORDER: ${{ vars.RELEVANCE_SECOND_ORDER || '' }}
          # v71p 3(A안): 영역 밖(out-* 접두어)만 2차 제외(기본 on), NULL·모르는 코드는 계속 2차. 되돌리기 = RELEVANCE_SECOND_SKIP_OUT_OF_AREA=off
          RELEVANCE_SECOND_SKIP_OUT_OF_AREA: ${{ vars.RELEVANCE_SECOND_SKIP_OUT_OF_AREA || '' }}
          # 2차 판정도 1차와 같은 기준(남헌 v67): 기본 v2.2, 리포 변수 RELEVANCE_CRITERIA=v21|old 로 되돌린다.
          RELEVANCE_CRITERIA: ${{ vars.RELEVANCE_CRITERIA || 'v22' }}
          LLM_DAILY_BUDGET_USD: ${{ vars.LLM_DAILY_BUDGET_USD || '5' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/relevance-second-judge-auto.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}

      # T2 완전 동의 자동 승인(CLAUDE.md §10.1 예외, reports/2026-09-28/approval-automation-design.md).
      # ⛔ 기본 꺼짐 — 리포 변수 AUTO_APPROVAL_ENABLED=true 와 AUTO_APPROVAL_SINCE=<YYYY-MM-DD> 가 없으면 DB 도 열지 않고 끝난다.
      # 킬스위치가 걸리면 승인 0건 + Notion 일일 상태 로그(사람판단필요). NOTION_API_TOKEN 은 다른 워크플로와 같은 목적의 기존 시크릿이다.
      - name: Auto-approve full-agreement verdicts (flag-gated, default off)
        if: success() && steps.judge.outputs.ran != 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/relevance-auto-approve.mjs

      # 케이스 무브 자동 승인 ca-v1(CLAUDE.md §10.1 예외 2, docs/case-approval-automation-roadmap.md).
      # ⛔ 기본 꺼짐 — 리포 변수 CASE_AUTO_APPROVAL_STAGE=candidate|approve 와 CASE_AUTO_APPROVAL_SINCE 가 없으면 DB 도 열지 않는다.
      # rr-v1 게이트에 종속이라 위 스텝과 같은 AUTO_APPROVAL_* 변수를 읽는다. 시크릿은 위 스텝과 같은 셋이다(새 시크릿 없음).
      - name: Case move auto-approval ca-v1 (stage-gated, default off)
        if: success() && steps.judge.outputs.ran != 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_SINCE: ${{ vars.AUTO_APPROVAL_SINCE || '' }}
          CASE_AUTO_APPROVAL_STAGE: ${{ vars.CASE_AUTO_APPROVAL_STAGE || 'off' }}
          CASE_AUTO_APPROVAL_SINCE: ${{ vars.CASE_AUTO_APPROVAL_SINCE || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/case-auto-approve.mjs

      # 결정 b(증량 싱크 8번): 사람 채점(human_verdict) 대비 LLM 판정 일치율을 매일 요약에 남긴다. 읽기 전용.
      - name: Relevance eval report (human vs LLM)
        if: always() && steps.judge.outputs.ran != 'false'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/relevance-eval-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # 자기 호출 체인(전량 판정 — lib/analysis/relevance-judge-all.ts decideRelaunch).
  # 판정 스크립트가 relaunch=true 를 남겼을 때만 다음 workflow_dispatch 를 부른다. 세션·사람 없이 이어진다.
  # 종료 조건(스크립트가 정한다): 미판정 0 · relevance_cap_until 만료 · 한도/오류 정지(quota·weekly_stop·hard_cap·cost_unknown·guard_config·save_failed)
  #   · 오류율 5% 초과 · 연속 2회 처리 0건 · 체인 하나당 hop 상한(RELEVANCE_CHAIN_MAX_HOPS, 기본 24 — 매일 정규 크론이 hop 0 으로 새 체인을 연다. 그래서 하루 총량 상한이 아니다) · 주간(하한)/5시간 창 안전선 확인 불가 · 주간 안전선 이상 · 드라이런 · RELEVANCE_CHAIN=off.
  #   5시간 창만 안전선 이상이면 끊지 않고 wait_min(90분) 쉬었다가 부른다.
  # concurrency(relevance-judge)는 실행 1개 + 대기 1개다. 이미 대기 중인 실행(크론 등)이 있으면 부르지 않는다 — 새 dispatch 가
  #   대기 중인 크론 실행을 밀어내(취소) watchdog 가 미발화로 읽지 않게. 그 대기 실행이 끝나며 다시 체인을 판단한다.
  # ⚠️ 이 job 만 actions 쓰기 권한(워크플로 수준은 contents: read 그대로) — GITHUB_TOKEN 의 workflow_dispatch 는 새 실행을 만든다(GitHub 예외 규칙).
  # 되돌리기 = 이 job 삭제(또는 리포 변수 RELEVANCE_CHAIN=off).
  relaunch:
    needs: judge
    # !cancelled(): 사람이 실행을 Cancel 하면 relaunch 도 건너뛴다(체인이 이어지지 않는다). always() 는 취소에도 돌아서 쓰지 않는다.
    if: ${{ !cancelled() && needs.judge.outputs.relaunch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      WAIT_MIN: ${{ needs.judge.outputs.wait_min }}
      NEXT_HOP: ${{ needs.judge.outputs.next_hop }}
      NEXT_ZERO: ${{ needs.judge.outputs.next_zero }}
    steps:
      - name: Dispatch next hop
        run: |
          case "$WAIT_MIN$NEXT_HOP$NEXT_ZERO" in *[!0-9]*|'') echo "::error::체인 출력이 숫자가 아니다 — 부르지 않는다"; exit 1;; esac
          if [ "$WAIT_MIN" -gt 0 ]; then echo "5시간 창 안전선 — ${WAIT_MIN}분 쉼"; sleep $((WAIT_MIN * 60)); fi
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly-relevance.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$busy" != "0" ]; then echo "이미 대기 중인 실행 ${busy}건 — 그 실행이 체인을 잇는다. 부르지 않음"; exit 0; fi
          gh workflow run nightly-relevance.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f dry_run=false -f chain_hop="$NEXT_HOP" -f chain_zero="$NEXT_ZERO"
          echo "다음 hop ${NEXT_HOP} 호출함(연속 0건 ${NEXT_ZERO})" | tee -a "$GITHUB_STEP_SUMMARY"
