# HN Firebase 옵션 C — dead/deleted 지속측정.
#
# 무엇을: 고정 표본(Airtable·Zapier, search_by_date page 0)을 다시 재서
#   reports/hn-firebase-c-dead-tracking.md 에 날짜 엔트리를 append 한다.
#   Algolia 인덱스 지연으로 stale(dead/deleted) 가 시간이 지나며 드러나는지 본다.
#
# ⛔ DB 를 건드리지 않는다. review_sources / review_collection_runs / analysis_inputs
#    어느 것도 읽거나 쓰지 않는다. 순수 측정이다.
# ⛔ 프로덕션 나이틀리 수집(nightly-review-collect.yml)과 무관하다.
# ⛔ Supabase secret 을 env 에 넣지 않는다 — 필요 없다.
#
# ⛔ 2026-09-17 은퇴 — schedule 을 껐다(남헌 결정). 이유는 두 겹이다.
#
#    ① **측정이 가설을 검증할 수 없는 설계였다.** 매 실행이 search_by_date page 0 으로
#       "그 시점 최신 댓글 50건" 을 **새로** 가져오고 objectID 를 저장하지 않는다.
#       가설은 "수집한 그 댓글들이 며칠 뒤 dead 로 바뀌나" 인데, 측정은 "방금 올라온
#       댓글이 지금 dead 인가" 를 묻는다. 갓 등록된 댓글은 당연히 stale 0 이라
#       **0 이외의 값이 구조적으로 나올 수 없다.**
#       증거: Airtable score max 가 1242 → 1482 → **867** 로 하락. HN score 는
#       내려가지 않으므로 최대값 하락은 표본 집합이 바뀌었다는 뜻이다.
#
#    ② **애초의 질문이 사라졌다.** "수집 단계에서 C 를 쓸까" 를 묻던 실험인데,
#       2026-09-17 남헌 결정으로 설계가 "수집은 A 로 넓게, C 는 인용 직전 검증에"
#       로 바뀌었다. 수집 필터로서의 C 는 더 이상 후보가 아니다.
#
#    ⚠️ **"0 이 나와서 기각" 이 아니다. 검증하지 못한 것이다.** 이 구분을 지우면
#       나중에 누군가 "봐, 계속 0 이었잖아" 로 잘못된 결론을 낸다(CLAUDE.md §7.1).
#
#    되살리려면 **코호트 고정이 먼저다** — 1회차 댓글 objectID 50×2 를 JSON 으로
#    저장하고, 이후 실행은 저장된 ID 를 Firebase 로 재조회해야 한다. 그 전까지
#    쌓이는 날짜는 판단 근거가 되지 않는다.
#    workflow_dispatch 는 남겨 둔다 — 고친 뒤 수동으로 확인할 수 있어야 한다.
#
# ⚠️ reports/ 프리픽스에만 커밋한다(CLAUDE.md §10.1). 다른 경로는 스테이징하지 않는다.

name: HN Firebase C Probe

on:
  workflow_dispatch:
    inputs:
      append:
        description: '리포트에 덧붙인다(끄면 stdout·요약에만)'
        type: boolean
        default: true

concurrency:
  group: hn-firebase-c-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Measure
        run: |
          # `| tee` 가 node 의 종료코드를 삼킨다 — pipefail 없이는 측정이 죽어도 초록불.
          set -o pipefail
          node scripts/hn-firebase-c-track.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.append == false) && ' ' || '--append' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit report
        # schedule 에선 inputs 가 null 이라 `null == false` 가 참이 된다 — event_name 으로 가드.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.append == false) }}
        run: |
          if git diff --quiet -- reports/hn-firebase-c-dead-tracking.md; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "hn-c-probe-bot"
          git config user.email "noreply@anthropic.com"
          git add reports/hn-firebase-c-dead-tracking.md
          git commit -m "chore(review): HN Firebase C 측정 — $(date -u +%F)"
          git push
