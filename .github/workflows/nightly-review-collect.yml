# 리뷰 수집 — 경쟁사 리뷰를 analysis_inputs 에 적재한다.
#
# 설계: docs/review-collection-design.md
# 소스는 다나와 하나다(docs/review-source-findings.md).
#
# ⛔ permissions 를 read 로 좁힌다. **인사이트 루프와 별도 잡인 이유가 이것이다.**
#    인사이트 루프는 main 에 커밋할 권한이 있고 수집기는 없다. 권한이 다른
#    일을 한 잡에 합치면 낮은 쪽이 높은 쪽으로 끌려간다.
#
# ⛔ 이 워크플로는 extract 를 부르지 않는다. analysis_inputs 를 채우고 멈춘다.
#    POST /api/analyze/extract 는 기존 aspects 를 delete→insert 하므로 자동으로
#    돌리면 사람이 검수해 둔 교정값이 매일 밤 날아간다.

name: Nightly Review Collect

on:
  schedule:
    # 18:00 UTC = KST 03:00. 인사이트 루프(KST 04:00)보다 한 시간 앞이다.
    # 둘은 서로 의존하지 않지만 같은 시각에 겹칠 이유도 없다.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '요청은 보내되 적재하지 않는다(판정만)'
        type: boolean
        default: true
      source:
        description: '수집할 소스'
        type: choice
        options: [danawa]
        default: danawa
      targets:
        description: '이번 실행에서 훑을 최대 타깃 수'
        type: string
        default: '10'

# 두 실행이 겹치면 같은 타깃의 커서를 서로 덮어쓴다.
concurrency:
  group: review-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Collect reviews
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/review-collect.mjs \
            --source=${{ inputs.source || 'danawa' }} \
            --targets=${{ inputs.targets || '10' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}
