<!-- @dsCard group="Components" viewport="700x300" name="Forms — Input · Select · Switch" subtitle="Field controls used across modals & filter bars" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:22px; background:var(--bg-app); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; max-width:560px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .lbl { font-size:12px; font-weight:500; color:var(--text-body); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, Switch } = window.DothegyWorksDesignSystem_cddc62;
  function Demo() {
    const [on, setOn] = React.useState(true);
    return (
      <div className="grid">
        <div className="field"><span className="lbl">제품</span><Input placeholder="제품 검색" defaultValue="티그레 6구 세트" /></div>
        <div className="field"><span className="lbl">수량</span><Input type="number" defaultValue={120} affix="개" /></div>
        <div className="field"><span className="lbl">구분</span><Select defaultValue="생산(+)" options={["생산(+)","출고(-)","실재고파악","입고(+)","폐기(-)"]} /></div>
        <div className="field"><span className="lbl">지점</span><Select placeholder="지점 선택" options={["3PL창고","공장","여의도","대구"]} /></div>
        <div className="field"><span className="lbl">기간 (직접 입력)</span><Input type="number" placeholder="직접 입력" affix="개월" /></div>
        <div className="field"><span className="lbl">본사 요약 모드</span><div style={{height:36,display:"flex",alignItems:"center"}}><Switch checked={on} onChange={setOn} label={on ? "생산 task만 표시" : "전체 표시"} /></div></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
