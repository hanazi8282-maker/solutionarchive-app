    <script>
(function(){
  // `.dark` drives the `dark:` Tailwind variant; `data-theme` activates the daisyUI theme.
  // Both must be set before first paint to avoid a flash of the wrong theme.
  function apply(d){
    document.documentElement.classList.toggle("dark",d);
    document.documentElement.dataset.theme=d?"dark":"light";
  }
  var p=(document.cookie.match(/(?:^|; )theme-preference=([^;]*)/)||[])[1]||"light";
  apply(p==="dark"||(p==="system"&&matchMedia("(prefers-color-scheme:dark)").matches));
  if(p==="system")matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(e){
    apply(e.matches);
  });
})();
</script>

  document.addEventListener("turbo:load", () => {
    document.querySelectorAll("#flash-messages > .alert").forEach(function (el) {
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 150ms ease";
        setTimeout(() => el.remove(), 150);
      }, 5000);

      const closeBtn = el.querySelector("button");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          el.style.opacity = "0";
          el.style.transition = "opacity 150ms ease";
          setTimeout(() => el.remove(), 150);
        });
      }
    });
  });
</script>
