# 리뷰 수집 — 경쟁사 리뷰를 analysis_inputs 에 적재한다.
#
# 설계: docs/review-collection-design.md
# 소스: 다나와 / App Store / Hacker News (docs/review-source-findings.md).
# 스케줄 실행은 `all` 이다 — 소스별로 try/catch 라 하나가 죽어도 나머지는 돈다.
#
# ⛔ permissions 를 read 로 좁힌다. **인사이트 루프와 별도 잡인 이유가 이것이다.**
#    인사이트 루프는 main 에 커밋할 권한이 있고 수집기는 없다. 권한이 다른
#    일을 한 잡에 합치면 낮은 쪽이 높은 쪽으로 끌려간다.
#
# ⛔ 이 워크플로는 extract 를 부르지 않는다. analysis_inputs 를 채우고 멈춘다.
#    POST /api/analyze/extract 는 기존 aspects 를 delete→insert 하므로 자동으로
#    돌리면 사람이 검수해 둔 교정값이 매일 밤 날아간다.
#    (2026-09-23: 자동 추출 자체는 `nightly-extract.yml` 이 KST 03:33 에 따로 돈다 —
#     collecting 상태만, force 없이. 검수 이후 상태는 extract-gate 가 계속 막는다.)

name: Nightly Review Collect

on:
  schedule:
    # 17:37 UTC = KST 02:37. 인사이트 루프(KST 03:41)보다 한 시간 앞이다.
    # 둘은 서로 의존하지 않지만 같은 시각에 겹칠 이유도 없다.
    #
    # ⚠️ 정각(`0 18`)을 쓰지 않는다. 정각·30분은 전 세계 크론이 몰리는
    #    시각이라 Actions 가 스케줄 실행을 뒤로 미루거나 통째로 건너뛴다.
    #    실측: 2026-09-01 18:00 UTC 에 예정된 첫 실행이 1시간이 지나도
    #    발화하지 않았고, 이 워크플로의 `schedule` 실행 이력은 그때까지
    #    0건이었다(수동 실행만 있었다). 어중간한 분으로 옮긴다.
    - cron: '37 17 * * *'
    # 05:37 UTC = KST 14:37. 남헌 2026-09-23 Q2(a) — **수집만** 하루 2회.
    # extract·relevance 는 1회 그대로다(LLM 무료 티어를 더 태우지 않는다. 수집은 LLM 을 안 쓴다).
    #
    # ⚠️ 요청 총량은 늘지 않는다. daily_request_cap 은 **UTC 날짜** 누적이고
    #    (lib/review/store.ts loadSource: since = 오늘 UTC 00:00), 두 슬롯은 같은 UTC 날짜
    #    (05:37 · 17:37)에 들어가 **한 몫을 나눠 쓴다**. 그래서 2회째의 효과는 '상한 증가'가
    #    아니라 **순서를 한 번 더 돌려 뒤쪽 소스에 차례를 주는 것**이다 — 2026-09-22 실측으로
    #    hackernews 가 30분을 혼자 쓰고 잘려 그 뒤 13개 소스가 한 줄도 안 돌았다.
    #    listDueTargets 가 last_run_at NULLS FIRST 라 한 번도 안 돈 타깃이 먼저 잡힌다.
    #
    # ⚠️ 순서상 UTC 날짜의 첫 소비자는 KST 14:37 쪽이다. KST 02:37(= 전날 17:37 UTC)이
    #    아니다 — 그 실행은 그 UTC 날짜의 두 번째가 되어 남은 몫만 쓴다. 상한에 걸린
    #    소스는 '일일 상한 도달'로 건너뛴다(runner.ts). 정상이지만 확인 대상이다(§7.2).
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '요청은 보내되 적재하지 않는다(판정만)'
        type: boolean
        default: true
      source:
        description: '수집할 소스 (all = 전체)'
        type: choice
        # ⚠️ 선택지에 없는 소스는 **스케줄로 한 번도 안 돈다.** appstore 가
        #    어댑터·마이그레이션까지 다 있는 채로 PR#16 머지 이후 계속 그
        #    상태였다. 어댑터를 추가하면 여기도 같이 늘려야 한다.
        #    round-1 에서 damoang·82cook 도 똑같이 빠뜨린 채 머지됐다(round-2 에서 복구).
        #    scripts/review-runner-selftest.mjs 가 ADAPTERS 맵과 이 목록을 대조한다.
        options:
          - all
          - danawa
          - appstore
          - hackernews
          - damoang
          - 82cook
          - theqoo
          - todayhumor
          - brunch
          - clien
          - fmkorea
          - bobaedream
          - tumblbug
          - naver_blog_post
          - okky
          - velog
          - youtube
        default: all
      targets:
        description: '이번 실행에서 훑을 최대 타깃 수'
        type: string
        default: '10'
      purge_apply:
        description: '원문 폐기를 실제로 실행한다(끄면 대상만 센다). 되돌릴 수 없다'
        type: boolean
        default: false

# 두 실행이 겹치면 같은 타깃의 커서를 서로 덮어쓴다.
concurrency:
  group: review-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # 30분에 잘려 hackernews 뒤 13개 소스가 한 줄도 안 돌았다(2026-09-22 실측: HN 혼자 29분 27초).
    # 남헌 2026-09-23 Q1(a) → 90분. 스크립트 쪽에는 실행 시간 상한이 없다 —
    # review-collect.mjs 의 유일한 시간 제한은 요청당 AbortSignal.timeout(20초)이고,
    # 실행 전체를 끊는 것은 이 값뿐이다. 그래서 여기만 늘리면 실제로 늘어난다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 요청 상한(review_sources.daily_request_cap) 자동 계산·반영. **수집 직전 1회.**
      #
      # 왜 여기인가(기술 판단, 2026-09-24):
      #   · 마이그레이션 후처리로 두면 사람이 타깃을 등록한 뒤 마이그레이션을 또 써야
      #     상한이 따라온다. 발굴 엔진이 `review_targets` 를 자동 등록하는 경로
      #     (CLAUDE.md §10.1)에는 마이그레이션이 아예 없어서 영영 안 따라온다.
      #   · DB 트리거로 두면 상한이 조용히 바뀌고 감사가 어렵다 — 누가 왜 올렸는지
      #     남기려면 트리거 안에서 로그를 쓰고 2배 규칙까지 SQL 로 복제해야 한다.
      #     그 규칙은 이미 순수함수(lib/review/request-cap.ts)에 한 벌 있고,
      #     셀프테스트가 그것만 본다. 두 벌로 늘리지 않는다.
      #   · 수집 직전이면 **이번 실행이 쓸 상한이 이번 실행의 타깃 수로 정해진다.**
      #     간격이 0 이라 "타깃은 늘었는데 상한은 내일부터" 가 생기지 않는다.
      #
      # 무인 실행이므로 `apply`(권장 ≤ 현재×2)만 반영한다. 그 위는 보류로 찍고 DB 를
      # 건드리지 않는다. ⚠️ 이 잡의 permissions 는 contents: read 라 보류 파일
      # (ops/state/request-cap/)은 커밋되지 않는다 — 여기서 보류의 기록은 이 스텝의
      # 로그와 review_source_cap_log 의 `new_cap IS NULL` 행이다(스크립트 머리말).
      #
      # continue-on-error: 상한 계산이 실패해도 수집은 돈다. 옛 상한으로 도는 것은
      # 안전한 쪽이고(모자라면 '일일 상한 도달'로 잘릴 뿐이다), 여기서 잡을 세우면
      # 계산 버그 하나가 그날 밤 수집을 0건으로 만든다.
      - name: Autocalc request cap
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/review-request-cap.mjs

      - name: Collect reviews
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # 끝에 Notion "일일 상태 로그" CTO 행 1개를 쓴다(scripts/review-collect-status.mjs).
          # 이 스텝에만 준다 — purge 스텝은 Notion 을 안 쓴다. 기록 실패는 수집 결과를 막지 않는다.
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          # YouTube Data API v3. 미등록이면 빈 값이고 review-collect 가 requiredEnv 검사로 youtube 만 건너뛴다.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node scripts/review-collect.mjs \
            --source=${{ inputs.source || 'all' }} \
            --targets=${{ inputs.targets || '10' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}

      # 원문 보존 기간(설계 §9) 집행. 수집이 실패해도 돌아야 한다 —
      # 수집 실패를 이유로 보존 기간이 밀리면, 지우기로 한 원문이 남는다.
      #
      # ⚠️ 기본이 dry-run 이다. 되돌릴 수 없는 동작이라 `purge_apply` 를
      #    명시적으로 켜야 실제로 지운다. 며칠 dry-run 으로 대상 건수를 눈으로
      #    보고 나서 켜는 것을 권한다.
      - name: Purge expired raw text
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/review-purge.mjs \
            ${{ ((github.event_name == 'workflow_dispatch' && inputs.purge_apply) || vars.REVIEW_PURGE_APPLY == 'true') && '--apply' || '' }}
