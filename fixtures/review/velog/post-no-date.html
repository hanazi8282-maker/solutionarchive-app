<!DOCTYPE html><html lang="ko"><head><meta charSet="utf-8"/></head><body><div id="root"></div><script>window.__APOLLO_STATE__={"ROOT_QUERY":{"auth":null,"velog_config({\"username\":\"doondoony\"})":{"type":"id","generated":true,"id":"$ROOT_QUERY.velog_config({\"username\":\"doondoony\"})","typename":"VelogConfig"},"post({\"url_slug\":\"mechanical-keyboards\",\"username\":\"doondoony\"})":{"type":"id","generated":false,"id":"Post:a82de330-904a-11e9-a22b-9f65e56e9695","typename":"Post"}},"$ROOT_QUERY.velog_config({\"username\":\"doondoony\"})":{"title":null,"logo_image":null,"__typename":"VelogConfig"},"Post:a82de330-904a-11e9-a22b-9f65e56e9695":{"id":"a82de330-904a-11e9-a22b-9f65e56e9695","title":"대단히 주관적인 기계식 키보드 사용 후기","released_at":null,"updated_at":"2026-09-17T02:14:01.432Z","tags":{"type":"json","json":["기계식키보드","키보드"]},"body":"## ☕️ 기계식 키보드를 왜 쓰게 되었나\n---\n기계식 키보드, 멤브레인, 펜타그래프, 무접점 아무것도 모르고 그냥 쓰던 시절에도, 이상하게 키감이 좋은 키보드는 있었습니다. 예를 들면, 로지텍 K310 (A.K.A. 물로 씻는 키보드) 가 그랬습니다. 멤브레인 키보드임에도 불구하고, 블록 모양의 키캡을 가지고 있어서 뭔가 타자기를 치는 느낌이었거든요. 그리고 첫 회사에 입사 후 맥북을 쓰게 되면서 애플 매직키보드를 사용하게 되었고 이게 기계식(무접점) 키보드 덕질의 시작이었습니다 \n\n## 🐶 개발자와 기계식 키보드\n---\n아무 상관 없는거 아시죠? 회사 옆자리에는 스택 오버 플로우 랭커 분이 계시지만 그냥 회사에서 지급해준 키보드 쓰고 계십니다. 그냥 일도 힘든데, 타이핑이라도 즐겁게 하자라는 차원에서 구입 하시면 됩니다. 물론 해커톤이나 모임에 해피해킹 블루투스를 가지고 오셔서 vi 로 코딩하시는 분들 보면 '앗 엄청난 Gosu?' 라는 생각이 들기는 합니다\n\n## ⌨️ 그 동안 사용해 본 키보드 목록\n---\n1. 애플 매직 키보드\n2. ABKO K965P 55g\n3. ABKO K945P 45g\n4. Realforce 87u 55g 균등\n5. 필코 마제스터치 컨버터블2 갈축\n6. 레오폴드 750R 갈축\n7. 레오폴드 900R 갈축\n8. VARMILO VA87MAC 밀키 화이트 영문 갈축\n9. 커세어 K63 WIRELESS 적축\n10. 필코 마제스터치2 텐키레스 청축\n11. RealForce R2 PFU Limited Edition 45g\n12. ABKO AR87 갈축 다크그레이\n\n저도 제가 이렇게까지 사고 팔았는지는 정말 몰랐네요 제 정신 아닌듯\n\n## 🏋️‍♀️ 키압에 대해\n---\n30g, 45g, 55g 가 보편적인 키압입니다.\n키압은, 무접점키보드의 사양에 해당하는 것이며 정확한 측정 방법에 대해 얘기할 수는 없지만\n대략 키가 입력될 때 까지 필요한 무게를 의미합니다\n\n각 키압별로 개인적인 경험에 대해 기술하자면\n\n### 30g 키보드\n---\n구매를 해서 사용해 본 적은 없습니다. 도쿄에 여행 갔을 때, 아키하바라에서 타건을 해본 경험이 있습니다.\n음... 개인적으로는 이게 멤브레인 키보드인지 비싼 리얼포스인지 구분이 잘 안됐습니다.\n더군다나 키압이 낮아서 금방 눌리다보니 되려 바닥을 치는 것 같은 기분이 많이 들었습니다\n\n30g 키보드 리뷰에 대한 건 이 분의 유튜브가 정말 최고인 것 같습니다\n","short_description":"기계식 키보드를 알고 싶으신가요?","is_markdown":true,"is_private":false,"is_temp":false,"thumbnail":"https://images.velog.io/post-images/doondoony/a83b0290-904a-11e9-a22b-9f65e56e9695/banner-image-2.png","comments_count":11,"url_slug":"mechanical-keyboards","likes":17,"liked":false,"user":{"type":"id","generated":false,"id":"User:9cbecad0-c621-11e8-8458-4f37b7730026","typename":"User"},"comments":[{"type":"id","generated":false,"id":"Comment:bdcd4db0-909b-11e9-a381-cdb19866bede","typename":"Comment"},{"type":"id","generated":false,"id":"Comment:adc1d242-2375-4414-a2cc-daa3b40dcf73","typename":"Comment"},{"type":"id","generated":false,"id":"Comment:57e476c6-be08-40e1-b7f5-04a5211d24dc","typename":"Comment"},{"type":"id","generated":false,"id":"Comment:809a2f5a-9627-4ac3-a924-1e256af21ffd","typename":"Comment"},{"type":"id","generated":false,"id":"Comment:f31131a1-4a84-4f4f-8b0f-5fa118a3ddb8","typename":"Comment"},{"type":"id","generated":false,"id":"Comment:db66f273-84c1-4984-ab66-db250a01e40e","typename":"Comment"}],"series":null,"linked_posts":{"type":"id","generated":true,"id":"$Post:a82de330-904a-11e9-a22b-9f65e56e9695.linked_posts","typename":"LinkedPosts"},"__typename":"Post"},"User:9cbecad0-c621-11e8-8458-4f37b7730026":{"id":"9cbecad0-c621-11e8-8458-4f37b7730026","username":"doondoony","is_followed":false,"profile":{"type":"id","generated":false,"id":"UserProfile:9d6a7420-c621-11e8-8458-4f37b7730026","typename":"UserProfile"},"velog_config":{"type":"id","generated":true,"id":"$User:9cbecad0-c621-11e8-8458-4f37b7730026.velog_config","typename":"VelogConfig"},"__typename":"User"},"UserProfile:9d6a7420-c621-11e8-8458-4f37b7730026":{"id":"9d6a7420-c621-11e8-8458-4f37b7730026","display_name":"DoonDoon","thumbnail":"https://images.velog.io/profiles/doondoony/thumbnails/1538470831.048.png","short_bio":"Espresso Cream Cat DD","profile_links":{"type":"json","json":{"url":"","emai
