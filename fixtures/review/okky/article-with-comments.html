ment","author":{"@type":"Person","name":"월급은나의빛","url":"https://okky.kr/users/192307"},"datePublished":"2026-09-17T21:08:33+09:00","text":"구글 지도 앱에서 “타임라인” 이라는 이름으로 제공하는 기능이지만 꺼두고 있습니다.","url":"https://okky.kr/articles/1564214#note-2086327","commentCount":3,"interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":1},{"@type":"InteractionCounter","interactionType":"https://schema.org/DislikeAction","userInteractionCount":0}],"comment":[{"@type":"Comment","author":{"@type":"Person","name":"오승용","url":"https://okky.kr/users/207346"},"datePublished":"2026-09-17T22:09:41+09:00","text":"@월급은나의빛 맞아요! 구글 타임라인처럼 방문 장소를 기록하는 기능은 이미 있더라고요.제가 생각하는 건 장소 기록 자체보다는 사진·일정 같은 흩어진 기록까지 연결해서 “그날 뭐 했지?”처럼 찾는 쪽이에요. 기존 기능과 차이를 더 명확하게 잡아보려고 합니다!","url":"https://okky.kr/articles/1564214#note-2086333","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"https://schema.org/DislikeAction","userInteractionCount":0}]},{"@type":"Comment","author":{"@type":"Person","name":"월급은나의빛","url":"https://okky.kr/users/192307"},"datePublished":"2026-09-17T23:04:04+09:00","text":"저는 구글에도 위치기록 제공을 거부하고 있으니 다른 앱에도 허용하지 않을 것 같네요. 타임라인은 여행이나 출장갈 때 잠시 켜곤 했는데 기록용으로 유용했습니다. 사진도 연동되니 그날 뭐했지는 충분히 알 수 있더군요. 내 동선을 너무 자세히 알아서 기분이 좀 나빠집니다.","url":"https://okky.kr/articles/1564214#note-2086340","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":1},{"@type":"InteractionCounter","interactionType":"https://schema.org/DislikeAction","userInteractionCount":0}]},{"@type":"Comment","author":{"@type":"Person","name":"오승용","url":"https://okky.kr/users/207346"},"datePublished":"2026-09-17T23:15:14+09:00","text":"@월급은나의빛 저도 이 부분이 제일 고민돼요. 처음부터 위치 권한을 꼭 받아야 하는 방식보다는, 위치 없이도 먼저 써볼 수 있게 하는 쪽으로 생각해보려고 합니다.","url":"https://okky.kr/articles/1564214#note-2086341","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"https://schema.org/DislikeAction","userInteractionCount":0}]}]},{"@type":"Comment","author":{"@type":"Person","name":"값이이상해요","url":"https://okky.kr/users/121085"},"datePublished":"2026-09-17T21:31:01+09:00","text":"지속적으로 GPS가 켜져있을 때 어느 정도 베이스 데이터들이 쌓일 것 같은데, 평소엔 꺼두고 “앱 사용 중에만 허용” 옵션을 주로 사용하는 저 같은 경우엔 해당되기 어려울 듯 하네요.아이디어 자체는 좋아보입니다.오늘 먹은 점심도 깜빡하는 청년치매라서ㅠㅠ","url":"https://okky.kr/articles/1564214#note-2086330","commentCount":1,"interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":1},{"@type":"InteractionCounter","interactionType":"https://schema.org/DislikeAction","userInteractionCount":0}],"comment":[{"@type":"Comment","author":{"@type":"Person","name":"오승용","url":"https://okky.kr/users/207346"},"datePublished":"2026-09-17T22:09:49+09:00","text":"@값이이상해요 맞아요. 저도 그 부분이 가장 큰 고민이에요.계속 GPS를 켜두는 방식이 아니라, 필요한 순간의 위치 정보만 최대한 적게 활용하는 구조로 가야 할 것 같아요.실제 앱으로 만들 때 꼭 검증해봐야 할 부분 같네요. 의견 감사합니다!","url":"https://okky.kr/articles/1564214#note-2086334","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"https://schema.org/LikeAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"https://schema.org/DislikeAction","userInteractionCount":0}]}]}]}</script>
